name: Build and Push AI Server Image

on:
  push:
    branches:
      - main
      - develop
      - "dev/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version tag, for example v0.1.1"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ai-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Run chatbot release gate
        env:
          CHAT_ANSWER_INTERNAL_TOKEN: ci-answer-token
          CHAT_RECOMMENDATION_INTERNAL_TOKEN: ci-recommendation-token
          RDB_EVIDENCE_ENABLED: "true"
          RDB_EVIDENCE_DSN: postgresql://reader:ci-password@localhost:5432/smap
          QDRANT_SEARCH_ENABLED: "true"
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: smap_internal_documents
          EMBEDDING_ENABLED: "true"
          EMBEDDING_BASE_URL: http://localhost:8002
          EMBEDDING_PATH: /embed
          EMBEDDING_MODEL: BAAI/bge-m3
          EMBEDDING_DIMENSION: "1024"
          LLM_ENABLED: "true"
          LLM_PROVIDER: openai_compatible
          LLM_BASE_URL: http://localhost:8001/v1
          LLM_MODEL: local-open-source-model
          LLM_MAX_TOKENS: "512"
          LLM_RESPONSE_CACHE_ENABLED: "true"
          LLM_RESPONSE_CACHE_TTL_SECONDS: "60.0"
          LLM_RESPONSE_CACHE_MAX_ENTRIES: "128"
          PROMPT_MAX_TOTAL_CHARS: "6000"
        run: >-
          python -m scripts.check_chat_runtime
          --preset full
          --answer-api-max-llm-total-tokens 2000
          --json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Prepare image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${IMAGE_NAME}:sha-${SHORT_SHA}"
            if [ -n "${{ inputs.version }}" ]; then
              echo "${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${IMAGE_NAME}:${{ inputs.version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
